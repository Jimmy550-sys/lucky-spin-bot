<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin - Premium Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #1a1528 0%, #0d0b14 100%);
            background-attachment: fixed;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header & Wallet Section */
        .header {
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 16, 32, 0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(127, 0, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .balance-box {
            background: rgba(255, 215, 0, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #ffd700;
            margin-top: 5px;
            font-size: 14px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
        }

        /* Custom Wallet Button */
        .custom-wallet-btn {
            background: #0098ea;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 152, 234, 0.4);
            transition: all 0.2s ease;
        }
        
        .custom-wallet-btn:active {
            transform: scale(0.95);
        }

        /* Content Container */
        .container {
            flex: 1;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .page {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .page.active {
            display: flex;
        }

        /* 3D Glowing Neon Spin Wheel Design */
        .wheel-container {
            position: relative;
            width: 310px;
            height: 310px;
            margin-bottom: 30px;
            background: padding-box, linear-gradient(135deg, #ff007f, #7f00ff);
            border: 6px solid transparent;
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(127, 0, 255, 0.5);
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #ff0055;
            z-index: 10;
            filter: drop-shadow(0px 0px 8px #ff0055);
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #120e1e;
        }

        /* Premium Cyberpunk Spin Button */
        .spin-btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 19px;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 4px solid rgba(0,0,0,0.4);
        }

        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
            border-bottom: 1px solid transparent;
        }

        .spin-count {
            margin-top: 12px;
            font-size: 14px;
            color: #b3b0c2;
            letter-spacing: 0.5px;
        }

        /* Adsterra Task List Design */
        .task-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(127, 0, 255, 0.15);
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .task-info h4 {
            font-size: 15px;
            color: #fff;
            margin-bottom: 4px;
        }

        .task-info p {
            font-size: 12px;
            color: #ffd700;
        }

        .task-btn {
            background: linear-gradient(45deg, #00c853, #00e676);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            box-shadow: 0 0 10px rgba(0, 200, 83, 0.3);
        }

        /* Leaderboard Setup */
        .leaderboard-list {
            width: 100%;
            background: rgba(15, 12, 28, 0.7);
            border: 1px solid rgba(127, 0, 255, 0.15);
            border-radius: 16px;
            padding: 10px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .leaderboard-item:last-child { border: none; }
